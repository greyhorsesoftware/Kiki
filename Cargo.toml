[workspace]
resolver = "2"
# What a plain `cargo build`/`cargo test` produces, and so what the package ships: the daemon,
# the share and service plugins, and the location kinds in `plugin::LOCATION_KINDS` (gio is `smb`
# alone in 0.1.0, and needs glib2 to build). The device plugins (mtp, ptp, afc; plan 17) left the
# tree on 2026-09-23 and are in git history, not here.
members = ["kikid", "crates/kiki-json", "crates/kiki-plugin-sdk", "plugins/kiki-plugin-sftp", "plugins/kiki-plugin-ftps", "plugins/kiki-plugin-gio", "plugins/kiki-plugin-dbus", "plugins/kiki-plugin-share-mail", "plugins/kiki-plugin-share-tailscale"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/davidjclark/kiki"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

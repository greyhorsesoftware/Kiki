[package]
name = "kikid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kiki file manager daemon"

[lib]
name = "kikid"
path = "src/lib.rs"

[[bin]]
name = "kikid"
path = "src/main.rs"

[[bin]]
name = "kiki-thumber"
path = "src/bin/kiki-thumber.rs"

[[bin]]
name = "kiki-plugin-stub"
path = "src/bin/kiki-plugin-stub.rs"

# The share host's own stub, built only for the test build (the dev-dependency below turns `stub`
# on): `share.rs` fetches, zips and hands over local paths, and something has to be there to
# receive them. A shipped kiki never builds it.
[[bin]]
name = "kiki-plugin-share-stub"
path = "src/bin/kiki-plugin-share-stub.rs"
required-features = ["stub"]

[features]
# The contract test drives the stub plugin, which is a location kind like any other, so the test
# build turns it on through the dev-dependency below. Shipped builds never have it.
stub = []

[dependencies]
kiki-json = { path = "../crates/kiki-json" }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38", features = ["fs", "net", "process", "std"] }

[dev-dependencies]
# Depending on ourselves is how a crate enables one of its own features for its tests only.
kikid = { path = ".", features = ["stub"] }

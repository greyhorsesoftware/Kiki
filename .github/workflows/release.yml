name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build kiki package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    image: "archlinux:latest" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "menci/archlinuxarm:base-devel" }
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf sudo glib2 gvfs gvfs-smb
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Set version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/PKGBUILD
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "FILE=kiki-${VERSION}-1-${{ matrix.arch }}.pkg.tar.zst" >> "$GITHUB_ENV"
      - name: makepkg
        run: |
          chown -R builder .
          sudo -u builder bash -c 'cd packaging && makepkg -f --nodeps --noconfirm'
          ls -l packaging/*.pkg.tar.zst
      - name: Checksum
        run: cd packaging && sha256sum "$FILE" > "$FILE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: |
            packaging/${{ env.FILE }}
            packaging/${{ env.FILE }}.sha256

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install or upgrade on Arch / Omarchy:

                curl -fsSL https://raw.githubusercontent.com/greyhorsesoftware/Kiki/main/install.sh | bash

            Or download the package for your architecture below and `sudo pacman -U` it.


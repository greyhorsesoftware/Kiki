name: Release

on:
  push:
    tags: ['v*']
  # By hand, from the Actions tab: builds and drives the package without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build kiki package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    image: "archlinux:latest" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "menci/archlinuxarm:base-devel" }
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf sudo glib2 gvfs gvfs-smb
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - name: Set version from tag
        id: ver
        run: |
          # A tag names the version; a run by hand keeps the PKGBUILD's own.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/PKGBUILD
          else
            VERSION="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "FILE=kiki-${VERSION}-1-${{ matrix.arch }}.pkg.tar.zst" >> "$GITHUB_ENV"
      - name: makepkg
        run: |
          chown -R builder .
          sudo -u builder bash -c 'cd packaging && makepkg -f --nodeps --noconfirm'
          ls -l packaging/*.pkg.tar.zst
      - name: Checksum
        run: cd packaging && sha256sum "$FILE" > "$FILE.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: |
            packaging/${{ env.FILE }}
            packaging/${{ env.FILE }}.sha256

  # The package, installed and used: the daemon and the shell it ships, driven under a headless
  # compositor through twenty-five flows (tests/e2e). Every push runs the unit, QML and package
  # jobs (ci.yml); this is the release's proof that what they built starts and works together.
  # x86_64 only for now; the same on ARM is a follow-up.
  drive:
    name: Install the package and drive it (x86_64, under cage)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    needs: build
    steps:
      - name: Install runtime
        # Quickshell comes from `extra` (0.3.1 as of 2026-09-23): the package the PKGBUILD
        # depends on and the one the owner runs. It was built from the AUR until then, which had
        # gone stale at 0.2.1.
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed git sudo cage wtype grim dbus \
            xdg-desktop-portal gnome-keyring openssh vsftpd ffmpeg python nodejs npm \
            qt6-base qt6-declarative qt6-wayland quickshell
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package-x86_64
          path: pkg
      - name: Install the package
        run: pacman -U --noconfirm --overwrite '*' pkg/kiki-*.pkg.tar.zst
      - name: Run the flows under cage
        # No build tree here on purpose: the harness falls back to the installed kiki, so what
        # runs is the package. Flows that need something this image does not have — a pointer
        # that the compositor can map to an output — skip by name and say so.
        run: |
          chown -R builder .
          sudo -u builder bash -c 'tests/e2e/run.sh'
      - name: Show the logs
        if: always()
        run: tail -n 40 tests/e2e/out/*.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diffs
          path: tests/e2e/out/**

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # Both architectures built, and the x86_64 package proven under cage. A run by hand stops here.
    needs: [build, drive]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install or upgrade on Arch / Omarchy:

                curl -fsSL https://raw.githubusercontent.com/greyhorsesoftware/Kiki/main/install.sh | bash

            Or download the package for your architecture below and `sudo pacman -U` it.


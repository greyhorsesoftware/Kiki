name: Release

# Run by hand, from the Actions tab. Takes the packages the newest green CI run on main built,
# drives the x86_64 one under a compositor, then tags the commit
# those packages were built from and publishes them. Nothing is built here: what is released is
# byte for byte what CI tested. The version is the code's — `pkgver` in that commit's PKGBUILD —
# and a version already tagged is refused, so releasing is: bump `pkgver` (and the workspace
# version), push, wait for green, run this.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag and publish. Off: just drive the package and stop.'
        type: boolean
        default: true

# The token needs to read Actions: `gh run list` and pulling another run's artifacts both go
# through that API, and the repository's default token has contents only.
permissions:
  actions: read
  contents: read

jobs:
  pick:
    name: Pick the CI run
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run" ] || { echo "no successful CI run on main to release"; exit 1; }
          sha="$(gh run view --repo "$GITHUB_REPOSITORY" "$run" --json headSha --jq .headSha)"
          # The newest green run is not the newest run when main has moved and its CI is still
          # going, or went red: releasing then quietly ships the commit before the fix. Say so and
          # stop. (A commit CI skips, docs only, starts no run, so it cannot trip this.)
          newest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --limit 1 --json databaseId,headSha,status,conclusion --jq '.[0]')"
          newest_id="$(jq -r .databaseId <<<"$newest")"
          if [ "$newest_id" != "$run" ]; then
            echo "the newest CI run on main is $(jq -r .headSha <<<"$newest") ($(jq -r '.status + (if .conclusion then " / " + .conclusion else "" end)' <<<"$newest")), not the newest green one ($sha)."
            echo "Wait for it to pass, or fix it, before releasing."
            exit 1
          fi
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pick.outputs.sha }}
          fetch-tags: true
      - id: version
        name: The version is the code's, and not one already released
        run: |
          version="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)"
          [ -n "$version" ] || { echo "no pkgver in packaging/PKGBUILD"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already a tag: bump pkgver in packaging/PKGBUILD (and the workspace version) and push first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing CI run ${{ steps.pick.outputs.run_id }}, commit ${{ steps.pick.outputs.sha }}, as v$version"

  # The package, installed and used: the daemon and the shell it ships, driven under a headless
  # compositor through twenty-five flows (tests/e2e), from the commit the package was built at.
  # x86_64 only for now.
  drive:
    name: Install the package and drive it (x86_64, under cage)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    needs: pick
    steps:
      - name: Install runtime
        # Quickshell comes from `extra` (0.3.1 as of 2026-09-23): the package the PKGBUILD
        # depends on and the one the owner runs. `samba` and `gvfs-smb` are for the `smb` flow:
        # the harness starts its own unprivileged smbd, and the daemon's gvfsd needs the backend.
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed git sudo cage wtype grim dbus \
            xdg-desktop-portal gnome-keyring openssh vsftpd ffmpeg python nodejs npm \
            qt6-base qt6-declarative qt6-wayland quickshell samba gvfs-smb
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: kiki-package-x86_64
          path: pkg
          run-id: ${{ needs.pick.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: The package carries the version
        run: ls "pkg/kiki-${{ needs.pick.outputs.version }}-1-x86_64.pkg.tar.zst" || { echo "CI run ${{ needs.pick.outputs.run_id }} built:"; ls pkg; echo "not ${{ needs.pick.outputs.version }}, the pkgver of its own commit — that should not happen"; exit 1; }
      - name: Install the package
        run: pacman -U --noconfirm --overwrite '*' pkg/kiki-*.pkg.tar.zst
      - name: Run the flows under cage
        # No build tree here on purpose: the harness falls back to the installed kiki, so what
        # runs is the package. Flows that need something this image does not have — a pointer
        # that the compositor can map to an output — skip by name and say so.
        run: |
          chown -R builder .
          sudo -u builder bash -c 'tests/e2e/run.sh'
      - name: Show the logs
        if: always()
        run: tail -n 40 tests/e2e/out/*.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diffs
          path: tests/e2e/out/**

  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    needs: [pick, drive]
    if: inputs.publish
    # A job's own `permissions` replaces the workflow's, so the read is repeated here.
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kiki-package-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.pick.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Both architectures, both checksums
        run: |
          cd dist && ls -l
          for a in x86_64 aarch64; do
            f="kiki-${{ needs.pick.outputs.version }}-1-$a.pkg.tar.zst"
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "missing $f or its checksum"; exit 1; }
            sha256sum -c "$f.sha256"
          done
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.pick.outputs.version }}
          target_commitish: ${{ needs.pick.outputs.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            Install or upgrade on Arch / Omarchy:

                curl -fsSL https://raw.githubusercontent.com/greyhorsesoftware/Kiki/main/install.sh | bash

            Or download the package for your architecture below and `sudo pacman -U` it.

  # The digests, written where the PKGBUILDs read them (docs/0.3.0/02-omarchy-store.md, decision
  # 3): the tag's tarball into packaging/PKGBUILD, each architecture's package into the store
  # package's (packaging/omarchy), and its .SRCINFO regenerated — as one commit on main, made here and not by hand, so a
  # checksum is never copied from anywhere but the build that produced the asset. Only when the
  # PKGBUILDs on main still say this version: once pkgver has moved on, the digests belong to a
  # release the tree no longer describes, and the step says so and stops.
  checksums:
    name: Write the checksums back
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: [pick, publish]
    permissions:
      contents: write
    steps:
      - name: Install git and makepkg
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git sudo
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Digests from the published assets and the tag's tarball
        env:
          VERSION: ${{ needs.pick.outputs.version }}
        run: |
          set -e
          [ "$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)" = "$VERSION" ] || { echo "main's PKGBUILD is not $VERSION any more; leaving the checksums to that version's release"; exit 0; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          for a in x86_64 aarch64; do
            curl -fsSL -o "pkg-$a.sha256" "$base/kiki-${VERSION}-1-$a.pkg.tar.zst.sha256"
            d="$(cut -d' ' -f1 "pkg-$a.sha256")"
            sed -i "s/^sha256sums_$a=.*/sha256sums_$a=('$d')/" packaging/omarchy/PKGBUILD
          done
          # GitHub's archive for a tag is stable once it exists; this is the digest the PKGBUILD
          # checks for anyone building the source package.
          curl -fsSL -o tag.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          d="$(sha256sum tag.tar.gz | cut -d' ' -f1)"
          sed -i "s/^  sha256sums=('[0-9a-f]*')/  sha256sums=('$d')/" packaging/PKGBUILD
          # As builder: makepkg refuses root, and .SRCINFO has no generator but makepkg. It also
          # insists on a writable build directory even to print, and the checkout is the runner's.
          chown -R builder packaging/omarchy
          (cd packaging/omarchy && sudo -u builder makepkg --printsrcinfo > .SRCINFO)
      - name: The store's package builds from the published asset, with the digest just written
        # What the Omarchy store's builders will do with this exact PKGBUILD: fetch the asset this
        # release published, check it against the line above, repackage it. If this fails, the
        # digest is wrong or the asset is not where the PKGBUILD says, and the release must not
        # commit it. (The source package's tarball digest is written above too, for anyone who
        # builds from source; the store does not, so it is not built here.)
        run: |
          mkdir -p /home/builder/build && cp packaging/omarchy/PKGBUILD packaging/omarchy/kiki.install /home/builder/build/ && chown -R builder /home/builder
          sudo -u builder env HOME=/home/builder PKGEXT=.pkg.tar.zst bash -c 'cd ~/build && makepkg -s --noconfirm && ls -l kiki-*.pkg.tar.zst && pacman -Qip kiki-*-x86_64.pkg.tar.zst | head -20'
      - name: Commit the checksums to main
        run: |
          # The checkout was written by the runner's user and this runs as root in the container:
          # git refuses a repository owned by somebody else until told the directory is safe.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/PKGBUILD packaging/omarchy/PKGBUILD packaging/omarchy/.SRCINFO
          git diff --cached --stat
          git commit -m "Release v${VERSION}: checksums" -m "The tag's tarball digest and each architecture's package digest, written by the release workflow."
          git push origin HEAD:main

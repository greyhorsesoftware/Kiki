name: CI

# Every push and pull request: format, lint, tests, and a package per architecture, kept as
# artifacts. Nothing here publishes anything — a release is a deliberate act, `release.yml`,
# run by hand: it takes a CI run's packages, drives one under a compositor, tags the commit they
# were built from and publishes them. What ships is what CI built and tested, and no commit
# becomes a release on its own.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything cargo, and the package, per architecture: one container, one checkout, one cache.
  # The package job used to be separate and built the release binaries again from cold; now
  # makepkg builds into the same cached `target/` the tests use. Cargo runs as `builder`
  # throughout because makepkg refuses root; root only installs packages.
  rust:
    name: Daemon, plugins and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    image: "archlinux:latest" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "menci/archlinuxarm:base-devel" }
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Install toolchain
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf sudo \
            openssh vsftpd ffmpeg dbus xdg-desktop-portal libpng glib2 gvfs gvfs-smb libsecret desktop-file-utils
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - run: chown -R builder . /home/builder
      - name: Format and lint
        run: sudo -u builder env HOME=/home/builder CARGO_TARGET_DIR="$CARGO_TARGET_DIR" make lint
      # The release profile, once: what the PKGBUILD's check() runs, and the build makepkg
      # below packages — so the daemon is compiled one time per run, not a dev build for the
      # tests and a release build for the package (docs/0.5.0/08-ci-once.md: the release
      # build was five of the job's eleven minutes on x86_64, and the dev build another three).
      # Under makepkg's own compiler flags (`as-makepkg`, below): cargo fingerprints every crate
      # by RUSTFLAGS, and makepkg exports `-C force-frame-pointers=yes` from makepkg.conf — a
      # test build without it is thrown away and compiled again by the package step, which is
      # what was happening (measured 2026-10-02: with the flags, makepkg's build is 0.15 s).
      - name: Unit and integration tests
        run: sudo -u builder env HOME=/home/builder CARGO_TARGET_DIR="$CARGO_TARGET_DIR" bash -c '. .github/as-makepkg.sh && cargo test --release --locked'
      - name: Protocol and plugin contract tests
        run: sudo -u builder env HOME=/home/builder CARGO_TARGET_DIR="$CARGO_TARGET_DIR" bash -c '. .github/as-makepkg.sh && cargo test --release --locked --test "*" -- --include-ignored'
      - name: makepkg
        # `--nocheck`: the PKGBUILD's check() is the whole test suite again in release profile,
        # and it has just run above on this commit. Building by hand still runs it. Its build()
        # is `cargo build --release --locked` into CARGO_TARGET_DIR, which the tests just filled:
        # a no-op here, and the package is the binaries the tests ran.
        # `PKGEXT`: Arch Linux ARM's makepkg.conf says `.pkg.tar.xz`; the installer and the
        # release name the file with `.zst` on both architectures, so this does too.
        # `KIKI_LOCAL_SRC`: the commit under test has no tag, so it is built from the checkout;
        # the store's from-nothing path is proved by the `store-package` job below; the tarball
        # path only at release, where the digest is written (release.yml, "checksums").
        run: |
          sudo -u builder env HOME=/home/builder CARGO_TARGET_DIR="$CARGO_TARGET_DIR" PKGEXT=.pkg.tar.zst KIKI_LOCAL_SRC=1 bash -c 'cd packaging && makepkg -f --nodeps --noconfirm --nocheck'
          cd packaging && ls -l && sha256sum kiki-*.pkg.tar.zst > "$(ls kiki-*.pkg.tar.zst).sha256" && ls -l kiki-*
      - name: namcap and the desktop entry
        # namcap warns about things that are sometimes right (docs/0.3.0/02-omarchy-store.md,
        # decision 7): its output is a thing a person reads in this log, not a failed build.
        # desktop-file-validate is held to silence: a hint there is kiki twice in the launcher.
        if: matrix.arch == 'x86_64'
        run: |
          pacman -S --noconfirm --needed namcap
          echo "== namcap: PKGBUILD"; KIKI_LOCAL_SRC=1 namcap packaging/PKGBUILD || true
          echo "== namcap: package"; namcap packaging/kiki-*.pkg.tar.zst || true
          echo "== desktop-file-validate"
          out="$(desktop-file-validate packaging/org.kiki.App.desktop 2>&1)"; echo "$out"; [ -z "$out" ]
      - name: Dependency audit
        # Each package kiki does NOT depend on, taken away in turn, and the consequence written
        # in the PKGBUILD's comment block held to by a test (kikid/tests/dep_audit.rs).
        if: matrix.arch == 'x86_64'
        run: |
          t() { sudo -u builder env HOME=/home/builder CARGO_TARGET_DIR="$CARGO_TARGET_DIR" bash -c '. .github/as-makepkg.sh && "$@"' -- "$@"; }
          echo "== without a Secret Service (libsecret present, gnome-keyring not, no session bus)"
          t env KIKI_AUDIT_NO_SECRET_SERVICE=1 cargo test --release --locked --test dep_audit -- --ignored secret_service
          echo "== without git"
          pacman -Rdd --noconfirm git
          t env KIKI_AUDIT_NO_GIT=1 cargo test --release --locked --test dep_audit -- --ignored without_git
          pacman -S --noconfirm --needed git
          echo "== without gvfs"
          pacman -Rdd --noconfirm gvfs-smb gvfs
          t env KIKI_AUDIT_NO_GVFS=1 cargo test --release --locked --test dep_audit -- --ignored without_gvfs
          pacman -S --noconfirm --needed gvfs gvfs-smb
      - uses: actions/upload-artifact@v7
        with:
          name: kiki-package-${{ matrix.arch }}
          path: |
            packaging/kiki-*.pkg.tar.zst
            packaging/kiki-*.pkg.tar.zst.sha256

  # The store's package, built the way the store's builders build it: a clean container, nothing
  # in it but packaging/omarchy/PKGBUILD and kiki.install, and `makepkg -s` fetching what it
  # repackages (docs/0.3.0/02-omarchy-store.md, L1). A branch has no release asset yet, so the
  # package the x86_64 job just built stands in for it — the same bytes a release would publish —
  # and its digest is written the way the release writes the real one. The tag-time proof, against
  # the asset actually published, is the release workflow's `checksums` job.
  store-package:
    name: Store package from nothing but its PKGBUILD (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: rust
    steps:
      - name: Install what makepkg -s cannot
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel sudo pacman-contrib
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kiki-package-x86_64
          path: /home/builder/build
      - name: A build directory with the PKGBUILD alone
        run: |
          cp packaging/omarchy/PKGBUILD packaging/omarchy/kiki.install /home/builder/build/
          rm -f /home/builder/build/*.sha256
          # Under the name the PKGBUILD downloads it as, so makepkg finds it here instead of on
          # GitHub, and updpkgsums hashes this very file.
          for f in /home/builder/build/kiki-*-1-x86_64.pkg.tar.zst; do mv "$f" "${f%-1-x86_64.pkg.tar.zst}-x86_64-release.pkg.tar.zst"; done
          chown -R builder /home/builder
      # As builder throughout: makepkg refuses root, and updpkgsums runs makepkg.
      - name: makepkg -s
        run: |
          sudo -u builder env HOME=/home/builder PKGEXT=.pkg.tar.zst bash -c '
            cd ~/build && ls -l
            updpkgsums
            makepkg -f -s --noconfirm
            ls -l kiki-*.pkg.tar.zst
            pacman -Qip kiki-*-x86_64.pkg.tar.zst | head -20'

  # The JSON reader and the frame reader under libFuzzer, a minute each, on x86_64 alone: the
  # bytes that reach them come from a window or a plugin, and the daemon is built with
  # `panic = "abort"`, so a panic in either is the end of every window (docs/0.5.0/03-fuzz-json.md).
  # A crash fails the job — this replaced a step that always printed a warning over a `fuzz/`
  # directory that did not exist. Nightly is what cargo-fuzz needs; it is pinned here and
  # nowhere else, and the fuzz crate is outside the workspace so nothing else sees it.
  fuzz:
    name: Fuzz the readers
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rustup clang pkgconf glib2
          rustup toolchain install nightly-2026-09-29 --profile minimal
          cargo +nightly-2026-09-29 install cargo-fuzz --locked
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Fuzz json_reader and frame_reader
        run: |
          cd fuzz
          cargo +nightly-2026-09-29 fuzz run json_reader -- -max_total_time=60 -max_len=65536
          cargo +nightly-2026-09-29 fuzz run frame_reader -- -max_total_time=60 -max_len=65536

  qml:
    name: QML leaf and interaction tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt
        # Beyond Qt itself: the SVG plugin the icons are drawn with, QtMultimedia and its ffmpeg
        # backend for the info panel's video player, and a font — a bare container has none, and
        # text with no metrics reports a pixel size of -1 and lays out on top of its neighbours.
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed make xorg-server-xvfb \
            qt6-base qt6-declarative qt6-svg qt6-multimedia qt6-multimedia-ffmpeg ttf-liberation
      - uses: actions/checkout@v7
      - name: Run qmltestrunner
        run: |
          # The leaf and interaction tests (plan 28): they drive synthetic mouse and key input,
          # which the offscreen platform delivers as long as each TestCase declares
          # `when: windowShown` and `visible: true`.
          export QT_QPA_PLATFORM=offscreen
          make test-qml

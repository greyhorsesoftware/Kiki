name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Daemon and plugins (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    image: "archlinux:latest" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "menci/archlinuxarm:base-devel" }
    steps:
      - name: Install toolchain
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf \
            openssh vsftpd ffmpeg dbus xdg-desktop-portal libpng libmtp libgphoto2 libimobiledevice usbmuxd glib2 gvfs gvfs-smb
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format and lint
        # `make lint` covers what the package ships (the workspace's default members); the
        # optional location plugins are built separately below so they cannot rot.
        run: make lint
      - name: Unit and integration tests
        run: make test-rust
      - name: Protocol and plugin contract tests
        run: cargo test --test '*' -- --include-ignored
      # Not in 0.1.0 (plan 31), but still in the tree: built here so they cannot rot. This is the
      # only job that needs libmtp, libgphoto2 and libimobiledevice.
      - name: Build the device plugins, which are not in the default build
        run: cargo build --release -p kiki-plugin-mtp -p kiki-plugin-ptp -p kiki-plugin-afc
      - name: JSON reader fuzz smoke
        run: |
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz run json_reader -- -max_total_time=60 || echo "::warning::fuzz target not present yet"
        continue-on-error: true

  qml:
    name: QML leaf and interaction tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt
        run: sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed make qt6-base qt6-declarative xorg-server-xvfb
      - uses: actions/checkout@v4
      - name: Run qmltestrunner
        run: |
          # The leaf and interaction tests (plan 28): they drive synthetic mouse and key input,
          # which the offscreen platform delivers as long as each TestCase declares
          # `when: windowShown` and `visible: true`.
          export QT_QPA_PLATFORM=offscreen
          make test-qml

  package:
    name: Build package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    image: "archlinux:latest" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "menci/archlinuxarm:base-devel" }
    steps:
      - name: Install build tools
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf sudo glib2 gvfs gvfs-smb
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          chown -R builder .
          sudo -u builder bash -c 'cd packaging && makepkg -f --nodeps --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: kiki-package-${{ matrix.arch }}
          path: packaging/kiki-*.pkg.tar.zst

  # The shell harness runs on x86_64 only for now; Quickshell from the AUR on ARM is a follow-up.
  e2e:
    name: End to end (a real daemon, a real tree)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    needs: [package]
    steps:
      - name: Install runtime
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git sudo cage wtype grim dbus \
            xdg-desktop-portal gnome-keyring openssh vsftpd ffmpeg python nodejs npm \
            qt6-base qt6-declarative qt6-wayland
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Quickshell from the AUR (cached)
        id: qs-cache
        uses: actions/cache@v4
        with:
          path: /home/builder/quickshell/*.pkg.tar.zst
          key: quickshell-${{ hashFiles('.github/quickshell-pin') }}
      - name: Build Quickshell if not cached
        if: steps.qs-cache.outputs.cache-hit != 'true'
        run: |
          sudo -u builder bash -c '
            cd ~ && git clone https://aur.archlinux.org/quickshell.git &&
            cd quickshell && git checkout "$(cat $GITHUB_WORKSPACE/.github/quickshell-pin)" &&
            makepkg -s --noconfirm'
      - name: Install Quickshell and kiki
        run: |
          pacman -U --noconfirm /home/builder/quickshell/*.pkg.tar.zst
      - uses: actions/download-artifact@v4
        with:
          name: kiki-package-x86_64
          path: pkg
      - run: pacman -U --noconfirm --overwrite '*' pkg/kiki-*.pkg.tar.zst
      - name: Run the flows under cage
        # No build tree here on purpose: the harness falls back to the installed kiki, so what
        # runs is the package. Flows that need something this image does not have — a pointer
        # that the compositor can map to an output — skip by name and say so.
        run: |
          chown -R builder .
          sudo -u builder bash -c 'tests/e2e/run.sh'
      - name: Show the logs
        if: always()
        run: tail -n 40 tests/e2e/out/*.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diffs
          path: tests/e2e/out/**

  bench:
    name: Benchmarks (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: rust
    steps:
      - name: Install toolchain
        run: sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf glib2 gvfs gvfs-smb
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Build kikid (release)
        run: cargo build --release -p kikid
      - name: Generate trees and measure
        run: |
          target/release/kikid bench gen all /tmp/kiki-bench
          target/release/kikid bench run /tmp/kiki-bench --json bench-linux-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-linux-x86_64
          path: bench-linux-x86_64.json
      - name: Compare with the checked-in baseline
        run: |
          if [ -f bench/baseline-linux-x86_64.json ]; then
            target/release/kikid bench compare bench/baseline-linux-x86_64.json bench-linux-x86_64.json --tolerance 40
          else
            echo "no baseline yet; copy the artifact to bench/baseline-linux-x86_64.json to start comparing"
          fi

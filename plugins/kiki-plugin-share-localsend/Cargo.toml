[package]
name = "kiki-plugin-share-localsend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kiki share plugin: LocalSend (native sender, protocol v2)"

[[bin]]
name = "kiki-plugin-share-localsend"
path = "src/main.rs"

[dependencies]
kiki-plugin-sdk = { path = "../../crates/kiki-plugin-sdk" }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The sender's own certificate: LocalSend receivers ask for one (mutual TLS) and name us by it.
# SO_REUSEADDR on the discovery socket, which std cannot set: the LocalSend app itself holds the port.
socket2 = { version = "0.6", features = ["all"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

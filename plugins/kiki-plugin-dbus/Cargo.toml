[package]
name = "kiki-plugin-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kiki's D-Bus face: org.freedesktop.FileManager1 and the FileChooser portal backend"

[[bin]]
name = "kiki-plugin-dbus"
path = "src/main.rs"

[dependencies]
kiki-plugin-sdk = { path = "../../crates/kiki-plugin-sdk" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util"] }

[package]
name = "kiki-plugin-share-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kiki share plugin: mail (desktop composer or SMTP with attachments)"

[[bin]]
name = "kiki-plugin-share-mail"
path = "src/main.rs"

[dependencies]
kiki-plugin-sdk = { path = "../../crates/kiki-plugin-sdk" }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"

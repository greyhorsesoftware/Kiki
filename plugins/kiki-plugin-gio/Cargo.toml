[package]
name = "kiki-plugin-gio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kiki location plugin over GIO/GVfs: smb, dav, afp (installed under each scheme's name; links GLib, build on Omarchy)"

[[bin]]
name = "kiki-plugin-gio"
path = "src/main.rs"

[dependencies]
kiki-plugin-sdk = { path = "../../crates/kiki-plugin-sdk" }
gio = { version = "0.20", features = ["v2_62"] }
glib = "0.20"
